<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Template Tool Title - CekHarian</title>
    <meta name="description" content="Mô tả chuẩn SEO cho tool này...">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F9FAFB; }</style>

    <script src="assets/js/global.js" defer></script>
</head>
<body class="flex flex-col min-h-screen">

    <div id="global-ad-top"></div>

    <div id="global-navbar"></div>

    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <div class="lg:col-span-2 space-y-6">
            
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">Tên Tool Tại Đây</h1>
                <p class="text-gray-500 text-sm mb-6">Mô tả ngắn gọn cách dùng tool...</p>

                <div class="bg-blue-50 p-10 rounded text-center border border-blue-200">
                    <p class="text-blue-600 font-bold">[KHUNG CHỨA INPUT & BUTTON]</p>
                    <button class="mt-4 bg-blue-600 text-white px-4 py-2 rounded">Action</button>
                </div>
                <div class="mt-8 flex justify-center">
                    <div class="ad-placeholder w-[300px] h-[250px]">AdSense Rect</div>
                </div>

                <div id="result" class="hidden mt-6 p-4 bg-green-50 border border-green-200 rounded">
                    Kết quả...
                </div>
                </div>

            <div id="global-suggestions"></div>

            <article class="prose prose-sm md:prose-base max-w-none bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2>Giới thiệu về Tool này</h2>
                <p>Đây là khu vực bài viết dài 1000 từ để SEO...</p>
                <h3>Cách tính toán</h3>
                <p>Giải thích thuật toán...</p>
            </article>

            <div class="flex justify-center">
                <div class="ad-placeholder w-[728px] h-[90px] hidden md:flex">Bottom Banner</div>
            </div>

        </div>

        <aside class="lg:col-span-1 space-y-6">
            <div class="sticky top-24">
                <div class="ad-placeholder w-[300px] h-[600px] mx-auto">Sticky Sidebar Ad</div>
            </div>
        </aside>

    </main>

    <div id="global-footer"></div>

    <script>
        // Viết code JS xử lý logic của riêng tool này ở đây
        console.log("Tool logic loaded");
    </script>

</body>
</html>
